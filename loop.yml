name: Autonomous Affiliate Loop

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-deals:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install telethon requests cryptg

      - name: Run Affiliate Bot
        run: python auto_affiliate.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_TG_CHANNEL: ${{ secrets.MY_TG_CHANNEL }}
          MY_AFFILIATE_TAG: ${{ secrets.MY_AFFILIATE_TAG }}

      - name: Save Posted Products Memory
        run: |
          git config --global user.name "AffiliateAutoBot"
          git config --global user.email "bot@noreply.github.com"
          git add posted_asins.txt
          git diff --staged --quiet || git commit -m "Update posted ASINs"
          git push
