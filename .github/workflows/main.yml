name: Autonomous Affiliate Loop

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: affiliate-bot-loop
  cancel-in-progress: true

jobs:
  post-deals:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install telethon requests cryptg beautifulsoup4

      - name: Pull Latest Memory Before Run
        run: |
          git config --global user.name "AffiliateAutoBot"
          git config --global user.email "bot@noreply.github.com"
          git pull origin main --no-edit || true
          touch posted_asins.txt

      - name: Run Affiliate Bot
        run: python auto_affiliate.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_TG_CHANNEL: ${{ secrets.MY_TG_CHANNEL }}
          MY_AFFILIATE_TAG: ${{ secrets.MY_AFFILIATE_TAG }}

      - name: Save Posted Products Memory
        if: always()
        run: |
          git config --global user.name "AffiliateAutoBot"
          git config --global user.email "bot@noreply.github.com"
          cp posted_asins.txt posted_asins_backup.txt
          git fetch origin main
          git checkout origin/main -- posted_asins.txt || touch posted_asins.txt
          cat posted_asins_backup.txt >> posted_asins.txt
          awk -F'|' '!seen[$1]++' posted_asins.txt > posted_asins_clean.txt
          mv posted_asins_clean.txt posted_asins.txt
          rm -f posted_asins_backup.txt
          git add posted_asins.txt
          git diff --staged --quiet || git commit -m "Update posted ASINs [skip ci]"
          git push origin HEAD:main
